<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Macaroni</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Comic Sans MS","Chalkboard SE","Marker Felt",cursive';
const BOIL_MS = 110;            // line-boil frame duration
let W, H, DPR, S, M, geom, boil = 0;
let PA = '#fff', IN = '#000';   // paper / ink — swapped to draw swallowed food inverted inside the mouth
const G = .18;

// ---------- drawing helpers (line boil = deterministic jitter that cycles through 3 frames) ----------
const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const J = (salt, i, amp) => (hash(salt * 7.137 + i * 1.731 + boil * 91.7) - .5) * 2 * amp;
const jp = (pts, salt, amp) => pts.map((p, i) => [p[0] + J(salt, i * 2, amp), p[1] + J(salt, i * 2 + 1, amp)]);
function curve(pts, closed) {
  const n = pts.length; ctx.beginPath();
  if (closed) {
    ctx.moveTo((pts[n-1][0] + pts[0][0]) / 2, (pts[n-1][1] + pts[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i+1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0]+q[0])/2, (p[1]+q[1])/2); }
    ctx.closePath();
  } else {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = pts[i], q = pts[i+1]; ctx.quadraticCurveTo(p[0], p[1], (p[0]+q[0])/2, (p[1]+q[1])/2); }
    ctx.lineTo(pts[n-1][0], pts[n-1][1]);
  }
}
const ell = (cx, cy, rx, ry, rot = 0, n = 14) => {
  const out = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry; out.push([cx + x*c - y*s, cy + x*s + y*c]); }
  return out;
};
function line(pts, salt, amp, lw) { if (pts.length < 2) return; ctx.lineWidth = lw; ctx.strokeStyle = IN; curve(jp(pts, salt, amp), false); ctx.stroke(); }
function shape(pts, salt, amp, fill, stroke, lw) {
  curve(jp(pts, salt, amp), true);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}

// ---------- macaroni ----------
function buildGeom(S) {
  const R = S * .62, th = S * .5, cy = R * .69, a0 = Math.PI * 1.1, a1 = Math.PI * 1.9, N = 10;
  const outer = [], inner = [];
  for (let k = 0; k <= N; k++) {
    const a = a0 + (a1 - a0) * k / N;
    outer.push([Math.cos(a) * (R + th/2), cy + Math.sin(a) * (R + th/2)]);
    inner.push([Math.cos(a) * (R - th/2), cy + Math.sin(a) * (R - th/2)]);
  }
  const ridges = [];
  for (let k = 1; k <= 4; k++) {
    const a = a0 + (a1 - a0) * k / 5.3;
    ridges.push([[Math.cos(a) * (R - th/2 + 2), cy + Math.sin(a) * (R - th/2 + 2)],
                 [Math.cos(a + .07) * R,          cy + Math.sin(a + .07) * R],
                 [Math.cos(a) * (R + th/2 - 2), cy + Math.sin(a) * (R + th/2 - 2)]]);
  }
  const hx = Math.cos(a1) * R, hy = cy + Math.sin(a1) * R;
  return { outline: [...outer, ...inner.reverse()], ridges,
           rim: ell(hx, hy, th * .5, th * .24, a1, 12), hole: ell(hx, hy, th * .28, th * .11, a1, 10) };
}
function drawMac(o, sc = 1) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.a); ctx.scale(o.flip * sc, sc);
  shape(geom.outline, o.id, 1.4, PA, IN, 2);
  geom.ridges.forEach((r, i) => line(r, o.id + i * 3.1, 1, 1.4));
  shape(geom.rim, o.id + 9, 1, PA, IN, 2);
  shape(geom.hole, o.id + 11, .8, IN);
  ctx.restore();
}

// ---------- sausage ----------
// A sausage is a chain of particles. Each particle remembers its rest position in the original shape,
// and shape matching (best-fit rotation of the rest shape) keeps the curve while it tumbles and lands.
function makeSausage() {
  const sp = S * .28, sr = S * .38, len = S * (6 + Math.random() * 3), n = Math.round(len / sp);
  const bend = (1.2 + Math.random() * 1.6) * (Math.random() < .5 ? -1 : 1), sCurve = Math.random() < .4;
  const raw = []; let x = 0, y = 0;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1), th = sCurve ? Math.sin((u - .5) * Math.PI * 2) * bend * .45 : (u - .5) * bend;
    raw.push([x, y]); x += Math.cos(th) * sp; y += Math.sin(th) * sp;
  }
  const cx = raw.reduce((s, p) => s + p[0], 0) / n, cy = raw.reduce((s, p) => s + p[1], 0) / n;
  const rot = Math.random() * Math.PI * 2, c = Math.cos(rot), s = Math.sin(rot);
  const rest = raw.map(([px, py]) => [(px - cx) * c - (py - cy) * s, (px - cx) * s + (py - cy) * c]);
  const minX = Math.min(...rest.map(p => p[0])), maxX = Math.max(...rest.map(p => p[0])), maxY = Math.max(...rest.map(p => p[1]));
  const ox = -minX + sr + Math.random() * Math.max(0, W - (maxX - minX) - 2 * sr), oy = -maxY - sr - 4;
  const sid = nid++;
  return { sid, sr, bitten: [false, false],
    pts: rest.map(([rx, ry]) => ({ x: rx + ox, y: ry + oy, px: rx + ox, py: ry + oy - 1.5, rx, ry, r: sr, sid, a: 0, va: 0 })) };
}
function drawSausage(s) {
  const P = s.pts, n = P.length, r = s.sr;
  if (n < 2) { shape(ell(P[0].x, P[0].y, r, r, 0, 10), s.sid, 1.2, '#fff', '#000', 2); return; }
  const N = [], T = [];
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    T.push([dx / d, dy / d]); N.push([-dy / d, dx / d]);
  }
  const at = (i, nk, tk) => [P[i].x + N[i][0] * nk + T[i][0] * tk, P[i].y + N[i][1] * nk + T[i][1] * tk];
  const cap = (i, sign, bitten, out) => {      // sign +1: end cap (forward), -1: start cap (backward)
    for (let k = 1; k < 8; k++) {
      const f = k / 8 * Math.PI, nk = Math.cos(f) * r * sign;
      const tk = bitten ? sign * r * (.1 + .3 * Math.abs(Math.sin(f * 2.5))) : sign * Math.sin(f) * r;
      out.push(at(i, nk, tk));
    }
  };
  const outline = [];
  for (let i = 0; i < n; i++) outline.push(at(i, r, 0));
  cap(n - 1, 1, s.bitten[1], outline);
  for (let i = n - 1; i >= 0; i--) outline.push(at(i, -r, 0));
  cap(0, -1, s.bitten[0], outline);
  shape(outline, s.sid, 1.3, '#fff', '#000', 2);

  const h = [];
  for (let i = Math.floor(n * .15); i < Math.ceil(n * .7); i++) h.push(at(i, r * .45, 0));
  line(h, s.sid + 5, 1, 1.4);

  [[0, -1], [n - 1, 1]].forEach(([i, sign], e) => {
    if (s.bitten[e]) {                         // meat speckles at the bite
      for (let k = 0; k < 3; k++) shape(ell(...at(i, (k - 1) * r * .45, -sign * r * (.15 + (k % 2) * .25)), 1.6, 1.6, 0, 5), s.sid + 20 + e * 5 + k, .6, '#000');
    } else {                                   // little twisted knot
      const tip = at(i, 0, sign * r);
      line([tip, at(i, r * .35, sign * r * 1.5)], s.sid + 30 + e, .8, 1.6);
      line([tip, at(i, -r * .35, sign * r * 1.5)], s.sid + 32 + e, .8, 1.6);
    }
  });
}

// ---------- mouth (lips) ----------
// Eaten food first slides in front of the lips to the opening (t 1 → .5),
// then continues inside, drawn white-on-black and clipped to the mouth opening (t .5 → 0).
function drawSwallowed(inside) {
  for (const w of swallowed) {
    if ((w.t > .5) === inside) continue;
    const k = inside ? 0 : (w.t - .5) * 2, e = k * k;
    const x = w.dx * e, y = w.dy * e + (inside ? (.5 - w.t) * M * .5 : 0);
    const sc = inside ? .7 - (.5 - w.t) * .6 : .7 + .3 * k;
    if (inside) [PA, IN] = [IN, PA];
    if (w.mac) drawMac({ ...w.mac, x, y, a: w.mac.a + (1 - w.t) * 1.5 }, sc);
    else shape(ell(x, y, w.r * sc, w.r * sc, 0, 10), w.id, 1.2, PA, IN, 2);
    if (inside) [PA, IN] = [IN, PA];
  }
}
function drawMouth(o) {
  const gp = o * M * .5, a = 2.2;
  const cav = [[-M*.95,0],[-M*.55,-gp*.55],[0,-gp*.6-M*.05],[M*.55,-gp*.55],[M*.95,0],[M*.55,gp*.6],[0,gp*.7],[-M*.55,gp*.6]];
  const upper = [[-M,0],[-M*.6,-M*.3-gp*.6],[-M*.15,-M*.42-gp*.6],[0,-M*.3-gp*.6],[M*.15,-M*.42-gp*.6],[M*.6,-M*.3-gp*.6],[M,0],
                 [M*.55,-gp*.55],[0,-gp*.6-M*.05],[-M*.55,-gp*.55]];
  const lower = [[-M,0],[-M*.55,gp*.6],[0,gp*.7+M*.04],[M*.55,gp*.6],[M,0],[M*.6,M*.32+gp*.7],[0,M*.45+gp*.7],[-M*.6,M*.32+gp*.7]];
  if (gp > 2) {
    shape(cav, 51, a, '#000');
    ctx.save(); curve(jp(cav, 51, a), true); ctx.clip(); drawSwallowed(true); ctx.restore();
    for (let i = -2; i <= 2; i++) shape([[i*M*.16-M*.07,-gp*.55],[i*M*.16+M*.07,-gp*.55],[i*M*.16+M*.06,-gp*.55+M*.14],[i*M*.16-M*.06,-gp*.55+M*.14]], 60+i, 1, '#fff', '#000', 1.5);
  }
  shape(upper, 41, a, '#fff', '#000', 2.2);
  shape(lower, 47, a, '#fff', '#000', 2.2);
  line([[-M*.3,M*.25+gp*.7],[0,M*.3+gp*.7],[M*.3,M*.25+gp*.7]], 49, 1, 1.4);
  drawSwallowed(false);
}

// ---------- state ----------
let macs, sausages, swallowed, score, t0, nextSpawn, nextSausage, nid = 1, over, fullFor;
const ptr = { x: innerWidth / 2, y: innerHeight / 2, touch: false };
const m = { x: innerWidth / 2, y: innerHeight / 2, o: 1, chomp: 0, nib: 0, delay: 0 };
function restart() {
  macs = []; sausages = []; swallowed = []; score = 0; t0 = performance.now(); over = false; fullFor = 0;
  nextSpawn = 1400; nextSausage = 7000 + Math.random() * 4000;
}
function resize() {
  DPR = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = Math.max(22, Math.min(40, Math.min(W, H) * .05)); M = S * 1.4; geom = buildGeom(S);
}
addEventListener('resize', resize); resize(); restart();

cv.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.touch = e.pointerType === 'touch'; });
cv.addEventListener('pointerdown', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.touch = e.pointerType === 'touch'; if (over) restart(); });

// ---------- physics: verlet particles + spatial grid; sausages add chain constraints ----------
function physics() {
  const all = macs.concat(...sausages.map(s => s.pts));
  for (const o of all) {
    const vx = (o.x - o.px) * .99, vy = (o.y - o.py) * .99;
    o.px = o.x; o.py = o.y; o.x += vx; o.y += vy + G; o.a += o.va;
  }
  const cell = S * 1.4;
  for (let it = 0; it < 5; it++) {
    const grid = new Map();
    all.forEach((o, i) => { o.i = i; const k = Math.floor(o.x / cell) + Math.floor(o.y / cell) * 4096; (grid.get(k) || grid.set(k, []).get(k)).push(o); });
    for (const o of all) {
      const cx = Math.floor(o.x / cell), cy = Math.floor(o.y / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const list = grid.get(cx + dx + (cy + dy) * 4096); if (!list) continue;
        for (const p of list) {
          if (p.i <= o.i || (o.sid && o.sid === p.sid)) continue;
          const ddx = p.x - o.x, ddy = p.y - o.y, d2 = ddx*ddx + ddy*ddy, rr = o.r + p.r;
          if (d2 < rr * rr && d2 > 1e-6) {
            const d = Math.sqrt(d2), push = (rr - d) / 2, nx = ddx / d, ny = ddy / d;
            o.x -= nx * push; o.y -= ny * push; p.x += nx * push; p.y += ny * push;
            o.va *= .85; p.va *= .85;
          }
        }
      }
    }
    for (const s of sausages) {
      const P = s.pts, n = P.length; if (n < 2) continue;
      let cx = 0, cy = 0, rx = 0, ry = 0;
      for (const q of P) { cx += q.x; cy += q.y; rx += q.rx; ry += q.ry; }
      cx /= n; cy /= n; rx /= n; ry /= n;
      let A = 0, B = 0;
      for (const q of P) { const ax = q.rx - rx, ay = q.ry - ry, bx = q.x - cx, by = q.y - cy; A += ax * bx + ay * by; B += ax * by - ay * bx; }
      const th = Math.atan2(B, A), c = Math.cos(th), sn = Math.sin(th);
      for (const q of P) {
        const ax = q.rx - rx, ay = q.ry - ry;
        q.x += (cx + ax * c - ay * sn - q.x) * .6; q.y += (cy + ax * sn + ay * c - q.y) * .6;
      }
    }
    for (const o of all) {
      if (o.y > H - o.r) { o.y = H - o.r; o.px = o.x - (o.x - o.px) * .7; o.va *= .8; }
      if (o.x < o.r) o.x = o.r; if (o.x > W - o.r) o.x = W - o.r;
    }
  }
  return all;
}

// Sausages can only be bitten at an end; each bite removes the end particle, so the next one is only
// within reach if the mouth travels along the curve. One bite per end per step caps the eating speed.
function eatSausages() {
  const br = M * .5;
  for (const s of sausages) {
    for (const e of [0, 1]) {
      const P = s.pts; if (!P.length) break;
      const end = e ? P[P.length - 1] : P[0];
      if (Math.hypot(end.x - m.x, end.y - m.y) < br) {
        e ? P.pop() : P.shift(); s.bitten[e] = true; score++; m.nib = 10;
        swallowed.push({ dx: end.x - m.x, dy: end.y - m.y, r: s.sr, id: s.sid + P.length, t: 1 });
      }
    }
  }
  sausages = sausages.filter(s => s.pts.length > 0);
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const el = now - t0;
  boil = Math.floor(now / BOIL_MS) % 3;
  acc += Math.min(100, now - last); last = now;

  while (acc >= 16.67) {
    acc -= 16.67;
    if (!over && el > nextSpawn) {
      const r = S * .62 * (.9 + Math.random() * .2), x = r + Math.random() * (W - 2 * r);
      macs.push({ x, y: -S * 2, px: x + (Math.random() - .5) * 1.5, py: -S * 2 - 2, a: Math.random() * 6.28, va: (Math.random() - .5) * .12, r, id: nid++, flip: Math.random() < .5 ? -1 : 1 });
      nextSpawn = el + Math.max(90, 650 - el / 60);
    }
    if (!over && el > nextSausage) { sausages.push(makeSausage()); nextSausage = el + 8000 + Math.random() * 7000; }
    const all = physics();

    const tx = ptr.x, ty = ptr.y - (ptr.touch ? M * 2 : 0);   // on touch, lift the mouth above the finger
    m.x += (tx - m.x) * .35; m.y += (ty - m.y) * .35;
    if (m.delay > 0 && --m.delay === 0) m.chomp = 1;   // keep the mouth open while the food slides in, then chomp
    else if (m.chomp > 0) m.chomp = Math.max(0, m.chomp - 1 / 14);
    if (m.nib > 0) m.nib--;
    swallowed.forEach(w => w.t -= 1 / 16); swallowed = swallowed.filter(w => w.t > 0);
    m.o = m.chomp > 0 ? 1 - Math.sin(Math.PI * m.chomp) : m.nib > 0 ? .55 + .45 * Math.abs(Math.sin(now / 45)) : 1;

    if (!over) {
      eatSausages();
      // eat as soon as food is in reach, even mid-chomp, so nothing sits hidden behind the lips
      const er = M * 1.05; let ate = false;
      macs = macs.filter(o => {
        if (Math.hypot(o.x - m.x, o.y - m.y) >= er) return true;
        score++; ate = true; swallowed.push({ mac: o, dx: o.x - m.x, dy: o.y - m.y, t: 1 }); return false;
      });
      if (ate && !m.delay && !m.chomp) m.delay = 7;
      const full = all.some(o => o.y - o.r < H * .06 && Math.abs(o.y - o.py) < .6);
      fullFor = full ? fullFor + 1 : 0;
      if (fullFor > 90) over = true;
    }
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  macs.forEach(o => drawMac(o));
  sausages.forEach(drawSausage);

  if (el > 1400 || score) {
    ctx.save(); ctx.translate(24, 52); ctx.rotate(J(500, 0, .025));
    ctx.fillStyle = '#000'; ctx.font = `bold 40px ${FONT}`;
    ctx.fillText(score, J(501, 0, 1), J(501, 1, 1)); ctx.restore();
  }

  ctx.save(); ctx.translate(m.x, m.y); drawMouth(m.o); ctx.restore();

  if (over) {
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(J(600, 0, .03));
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000';
    ctx.font = `bold 72px ${FONT}`; ctx.lineWidth = 10;
    ctx.strokeText('FULL!', 0, 0); ctx.fillText('FULL!', 0, 0);
    ctx.font = `bold 28px ${FONT}`; ctx.lineWidth = 6;
    ctx.strokeText(`you ate ${score} — tap to go again`, 0, 50); ctx.fillText(`you ate ${score} — tap to go again`, 0, 50);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
